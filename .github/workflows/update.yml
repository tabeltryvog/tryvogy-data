name: Оновлення даних про тривоги
on:
  schedule:
    - cron: "7 * * * *"   # щогодини
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_data.py
      - name: Зберегти зміни
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "tabel-tryvog-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/alerts.json data/health.json
            git commit -m "Оновлення даних про тривоги"
            git push
          fi
